name: ms-tasks

services:
  ms-tasks:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: ms-tasks:local
    container_name: ms-tasks
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: tasks
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-tasks_local}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      oracle:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: ms-tasks-oracle
    environment:
      ORACLE_RANDOM_PASSWORD: "true"
      APP_USER: tasks
      APP_USER_PASSWORD: ${DB_PASSWORD:-tasks_local}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  oracle-data:
