spring:
  application:
    name: ms-tasks
  main:
    banner-mode: off
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: tasks
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.fetch_size: 100

server:
  port: 8082

management:
  endpoints:
    access:
      default: none
  endpoint:
    health:
      access: read-only

logging:
  structured:
    format:
      console: ecs

app:
  cors:
    allowed-origins: http://localhost:8080
